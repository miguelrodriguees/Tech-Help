# Ativar somente no servidor: --spring.profiles.active=hospedagem
# Sem valores padrao: nunca herdar root/senha vazia do desenvolvimento.
spring.datasource.url=${TECHHELP_DB_URL}
spring.datasource.username=${TECHHELP_DB_USERNAME}
spring.datasource.password=${TECHHELP_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Aplicacao e MariaDB devem ficar privados; acesso publico pelo proxy HTTPS.
server.address=127.0.0.1
server.port=${TECHHELP_PORT:8080}
# O proxy local deve remover/substituir cabecalhos Forwarded enviados pelo visitante.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
