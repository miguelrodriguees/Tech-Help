# Um único endereço para frontend e backend; acesso direto limitado à máquina local.
server.address=127.0.0.1
server.port=8082
# Bind local: reconhecer HTTPS/host originais encaminhados pelo túnel.
server.forward-headers-strategy=framework
spring.jpa.show-sql=false
# true para HTTPS pelo túnel; false apenas na conferência local por HTTP.
server.servlet.session.cookie.secure=${TECHHELP_COOKIE_SECURE:true}
